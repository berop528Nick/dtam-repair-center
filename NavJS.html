<script>
    /* ============================================================
       NavJS.html — นำทางในหน้าเดียว (client-side navigation)
       ------------------------------------------------------------
       กดเมนู ?page=... แล้วสลับเนื้อหาในเอกสารเดิม ไม่โหลดหน้าใหม่ทั้งหน้า
       จึงไม่มีจอขาว ไม่มีฟอนต์สลับ และไม่มีตัวหมุนขึ้นใหม่ทุกคลิก

       หลักการ
       1) ดักคลิกเฉพาะลิงก์ของแอป (?page=...) ที่อยู่โดเมนเดียวกัน
       2) fetch หน้าเป้าหมาย แล้วเอา <body> ใหม่มาสลับของเดิม
       3) สคริปต์ใน <body> ที่สลับเข้ามาจะไม่รันเอง ต้องสร้างใหม่ให้รันตามลำดับ
       4) สคริปต์ "สถานะโหลด" ของหน้าใหม่ถูกตัดออก (ไม่ต้องซ่อนเนื้อหาอีก)
       5) พลาดเมื่อไร (เน็ตหลุด/หน้าผิดรูป) ถอยไปโหลดหน้าใหม่แบบปกติทันที
       ============================================================ */
    (function () {
        'use strict';

        /* สคริปต์นี้ติดมากับ <body> จึงถูกโหลดซ้ำหลังสลับหน้า — ลงทะเบียนครั้งเดียวพอ */
        if (window.__dtamNav) {
            return;
        }

        var nav = window.__dtamNav = { busy: false, pending: '', timer: 0, waitTimer: 0, waitShownAt: 0, timeout: 0, current: '' };

        /* กันค้างเงียบ : เรียกเซิร์ฟเวอร์แล้วเงียบเกิน NAV_TIMEOUT_MS
           (เน็ตหลุด/เซิร์ฟเวอร์ค้าง/ตอบกลับไม่มา) ให้เลิกสลับในที่เดียว
           แล้วโหลดหน้าใหม่ตามปกติ — ดีกว่าปุ่มตายกดอะไรต่อไม่ได้เลย */
        var NAV_TIMEOUT_MS = 20000;

        function clearNavTimeout() {
            if (nav.timeout) {
                window.clearTimeout(nav.timeout);
                nav.timeout = 0;
            }
        }

        /* ---------- สถานะกำลังโหลดตอนสลับหน้า ----------
           โชว์เมื่อรอเกิน 120ms (เร็วว่านั้นให้ดูเหมือนเปลี่ยนทันที ไม่มีสปินเนอร์วาบ)
           และถ้าโชว์แล้วให้ค้างอย่างน้อย 200ms เพื่อให้เห็นได้จริง
           (คืนค่าจำนวน ms ที่ยังต้องรอเพิ่ม) */
        function beginWait() {
            if (nav.waitTimer) {
                window.clearTimeout(nav.waitTimer);
            }

            nav.waitShownAt = 0;

            nav.waitTimer = window.setTimeout(function () {
                nav.waitTimer = 0;
                nav.waitShownAt = Date.now();
                document.documentElement.classList.add('is-nav-wait');
            }, 120);
        }

        function endWait() {
            if (nav.waitTimer) {
                window.clearTimeout(nav.waitTimer);
                nav.waitTimer = 0;
            }

            var shownAt = nav.waitShownAt || 0;

            nav.waitShownAt = 0;
            document.documentElement.classList.remove('is-nav-wait');

            return shownAt ? Math.max(0, 200 - (Date.now() - shownAt)) : 0;
        }

        var LOADER_MARK = 'เติมคลาสที่ <html>';

        function inIframe() {
            try {
                return window.top !== window.self;
            } catch (e) {
                return true;
            }
        }

        /* คืน URL ของหน้าในแอป หรือ null ถ้าไม่ใช่ */

        function appUrl(href) {
            var url;

            try {
                url = new URL(href, window.location.href);
            } catch (e) {
                return null;
            }

            if (url.origin !== window.location.origin) {
                return null;
            }

            if (!url.searchParams.has('page')) {
                return null;
            }

            /* ไม่ต้องพา nav=1 (ตัวจำสถานะโหลด) ติดไปด้วยแล้ว */
            url.searchParams.delete('nav');

            /* คง token ไว้บน URL (?t=…) เพื่อให้รีเฟรชแล้วไม่ต้องล็อกอินใหม่
               (storage ใน iframe ของ Apps Script มักถูกบล็อก/ถูกล้าง) */
            var token = (window.App && window.App.auth) ? window.App.auth.token() : '';

            if (token && url.searchParams.get('page') !== 'login') {
                url.searchParams.set('t', token);
            }

            return url;
        }

        /* ลายเซ็นของหน้า : ไฟล์ + page + scope + no (ไม่สน token / nav)
           เอาไว้เทียบว่าลิงก์ที่กดคือ "หน้านี้" อยู่แล้วหรือไม่ */
        function navKey(u) {
            try {
                var file = String(u.pathname.split('/').pop() || '').toLowerCase();
                var page = String(u.searchParams.get('page') || 'form').toLowerCase();
                var scope = String(u.searchParams.get('scope') || '').toLowerCase();
                var no = String(u.searchParams.get('no') || '').toUpperCase();
                return [file, page, scope, no].join('|');
            } catch (e) {
                return '';
            }
        }

        /* อยู่หน้านี้อยู่แล้ว = ไม่ต้องทำอะไร (กันกดเมนูซ้ำแล้วโหลด/สลับใหม่)
           เทียบกับหน้าที่จำไว้ในหน่วยความจำก่อน (nav.current อัปเดตทุกครั้งที่สลับสำเร็จ)
           แล้วค่อยเทียบกับ URL — เพราะบางเบราว์เซอร์/sandbox บล็อก pushState
           ทำให้ URL ค้างเป็นหน้าเก่า (เช่น รีเฟรชแล้วกดเมนูแจ้งปัญหา​จากแดชบอร์ด
           กลับถูกมองว่าอยู่หน้าฟอร์มแล้ว) ถ้าจำไว้เลยจะไม่หลงตาม URL ค้าง */
        function isSamePage(url) {
            try {
                var here = nav.current || navKey(new URL(window.location.href));
                return navKey(url) === here;
            } catch (e) {
                return false;
            }
        }

        function skip(link) {
            var target = (link.getAttribute('target') || '').toLowerCase();
            var href = link.getAttribute('href') || '';

            if (link.hasAttribute('download') || link.hasAttribute('data-no-nav')) {
                return true;
            }

            /* อยู่ใน iframe ของ Apps Script + target=_top : ให้เบราว์เซอร์พาออกไปเองตามเดิม */
            if (target === '_top' && inIframe()) {
                return true;
            }

            if (target === '_blank') {
                return true;
            }

            return href.charAt(0) === '#' || /^(mailto|tel|javascript):/i.test(href);
        }

        /* สคริปต์ที่ถูกสลับเข้ามาจะไม่ทำงาน ต้องสร้าง element ใหม่ให้เบราว์เซอร์รัน */
        function runScripts(scripts) {
            Array.prototype.forEach.call(scripts, function (old) {
                var fresh = document.createElement('script');

                Array.prototype.forEach.call(old.attributes, function (attr) {
                    fresh.setAttribute(attr.name, attr.value);
                });

                fresh.text = old.textContent;
                old.parentNode.replaceChild(fresh, old);
            });
        }

        function swap(html, url, push) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var body = doc.body;

            if (!body) {
                throw new Error('หน้าเป้าหมายไม่มี <body>');
            }

            var scripts = Array.prototype.slice.call(body.querySelectorAll('script'));

            /* ตัดสคริปต์สถานะโหลดของหน้าใหม่ทิ้ง ไม่งั้นเนื้อหาจะถูกซ่อน 430ms อีก */
            for (var i = scripts.length - 1; i >= 0; i--) {
                if ((scripts[i].textContent || '').indexOf(LOADER_MARK) !== -1) {
                    scripts[i].parentNode.removeChild(scripts[i]);
                    scripts.splice(i, 1);
                }
            }

            document.title = doc.title || document.title;

            /* CSS เฉพาะหน้าอยู่ใน <head> (แต่ละหน้ามี <style> ของตัวเอง)
               ถ้าไม่สลับตามไปด้วย หน้าใหม่จะถูกจัดสไตล์ด้วย CSS ของหน้าเดิม
               = หน้าตาเพี้ยน/เห็นเป็นกระพริบตอนเปลี่ยนหน้า
               สลับเฉพาะ "ของเฉพาะหน้า" : ตัวที่ข้อความไม่อยู่ในชุดใหม่เอาออก
               ตัวที่ยังไม่มีค่อยเพิ่ม — สไตล์กลาง (Styles) ไม่ถูกสร้างใหม่
               จึงไม่เกิดอาการหน้าจอไร้สไตล์ชั่วขณะ */
            var newStyleTexts = [];

            Array.prototype.forEach.call(doc.head.querySelectorAll('style'), function (el) {
                newStyleTexts.push(el.textContent);
            });

            if (newStyleTexts.length) {
                Array.prototype.forEach.call(Array.prototype.slice.call(document.head.querySelectorAll('style')), function (el) {
                    if (newStyleTexts.indexOf(el.textContent) === -1) {
                        el.parentNode.removeChild(el);
                    }
                });

                Array.prototype.forEach.call(doc.head.querySelectorAll('style'), function (el) {
                    var exists = Array.prototype.some.call(document.head.querySelectorAll('style'), function (cur) {
                        return cur.textContent === el.textContent;
                    });

                    if (!exists) {
                        var clone = document.createElement('style');
                        clone.textContent = el.textContent;
                        document.head.appendChild(clone);
                    }
                });
            }

            /* PAGE_ID / CURRENT_USER เป็นค่าของหน้าเดิม ล้างก่อนแล้วให้สคริปต์หน้าใหม่ตั้งเอง */
            try {
                delete window.PAGE_ID;
            } catch (e) {
                window.PAGE_ID = '';
            }

            /* จำสถานะเมนูข้างของหน้าเดิม (การสลับเนื้อหาจะสร้างเมนูใหม่ขึ้นมา)
               แล้วคงสถานะเดิมไว้ ไม่งั้นเมนูจะเปิด/ปิดใหม่ทุกครั้งที่เปลี่ยนหน้า = กระพริบ */
            var live = document.body;
            var sidebarOpen = !live.classList.contains('sidebar-collapsed');

            window.__dtamSidebarState = sidebarOpen;

            /* ============================================================
               สลับเนื้อหา "ในเอกสารเดิม" ไม่สร้าง <body> ใหม่
               ------------------------------------------------------------
               เดิมใช้ documentElement.replaceChild(body, document.body) แล้ว
               ย้ายแถบหัว/เมนูข้างกลับเข้าไป — การถอดเมนูข้างออกจากเอกสารแล้ว
               ใส่กลับทำให้เบราว์เซอร์ต้อง rasterise พื้นสีเข้มของเมนูใหม่
               เห็นเป็นเมนูข้างกระพริบหนึ่งเฟรม (โค้ดเดิมจึงต้องคั่นด้วยคอมเมนต์
               เรื่อง "สร้างใหม่ทุกครั้ง = กระพริบ")
               ตอนนี้คง <body> เดิมไว้ และคงแถบหัว/เมนูข้างไว้ในตำแหน่งเดิม
               ไม่ถอดออกจากเอกสารเลย => ไม่มีเฟรมที่ขาดเมนู
               ============================================================ */
            var keptNew = [];
            var keptOld = [];

            ['.site-header', '.app-header', '#sidebar'].forEach(function (sel) {
                var oldEl = live.querySelector(sel);
                var newEl = body.querySelector(sel);

                if (!oldEl || !newEl) {
                    return;
                }

                /* เมนูบน : ไม่ให้แผงที่เปิดค้างอยู่ติดไปหน้าถัดไป */
                oldEl.classList.remove('nav-open');
                oldEl.classList.remove('nav-closing');
                oldEl.classList.remove('nav-wide-in');

                var navToggle = oldEl.querySelector('#siteNavToggle');

                if (navToggle) {
                    navToggle.setAttribute('aria-expanded', 'false');
                }

                /* ล้างไฮไลต์ของหน้าเดิม (ทั้งเมนูข้างและเมนูบน)
                   เดี๋ยวใส่ไฮไลต์ของหน้าเป้าหมายกลับในงานเดียวกันด้านล่าง */
                Array.prototype.forEach.call(oldEl.querySelectorAll('.nav-link.active'), function (el) {
                    el.classList.remove('active');
                });

                Array.prototype.forEach.call(oldEl.querySelectorAll('.site-nav a.is-active'), function (el) {
                    el.classList.remove('is-active');
                });

                keptNew.push(newEl);
                keptOld.push(oldEl);
            });

            /* คลาส/แอตทริบิวต์ของ <body> : ใช้ของหน้าใหม่ (page-app / form-page / ...) */
            Array.prototype.forEach.call(Array.prototype.slice.call(body.attributes), function (attr) {
                if (live.getAttribute(attr.name) !== attr.value) {
                    live.setAttribute(attr.name, attr.value);
                }
            });

            Array.prototype.forEach.call(Array.prototype.slice.call(live.attributes), function (attr) {
                if (!body.hasAttribute(attr.name)) {
                    live.removeAttribute(attr.name);
                }
            });

            /* ตัดเนื้อหาเดิมออก เหลือไว้เฉพาะของที่ต้องคงอยู่ */
            Array.prototype.slice.call(live.children).forEach(function (child) {
                if (keptOld.indexOf(child) === -1) {
                    live.removeChild(child);
                }
            });

            /* วางเนื้อหาใหม่ตามลำดับเดิม : ของที่คงไว้ไม่ถูกถอด/ใส่กลับ
               (ถ้าตำแหน่งตรงอยู่แล้วก็ไม่แตะ) */
            var kids = Array.prototype.slice.call(body.children);
            var nextRef = null;

            for (var k = kids.length - 1; k >= 0; k--) {
                var newKid = kids[k];
                var keptIdx = keptNew.indexOf(newKid);
                var node = keptIdx === -1 ? newKid : keptOld[keptIdx];

                if (nextRef === null) {
                    if (node.parentNode !== live || node.nextSibling !== null) {
                        live.appendChild(node);
                    }
                } else if (node.nextSibling !== nextRef) {
                    live.insertBefore(node, nextRef);
                }

                nextRef = node;
            }

            /* ของที่คงไว้ (แถบหัว/เมนูข้าง) : ใส่ "ตัวเดิม" กลับแทนตัวใหม่
               （ตัวใหม่จากหน้าเป้าหมายถูกทิ้ง）— ภาพโปรไฟล์/ตัวอักษร/สถานะเมนู
               จึงไม่ถูกวาดใหม่เลย */
            keptNew.forEach(function (newEl, i) {
                /* ต้องเช็กว่าตัวใหม่ยัง "อยู่ในเอกสารจริง" ก่อน
                   ถ้าตัวใหม่ถูกแทนไปแล้วในลูปประกอบเนื้อหา (เช่น .site-header
                   ที่เป็นลูกของ <body> โดยตรง) การ replaceChild ตรงนี้จะย้าย
                   ตัวเดิมออกจากเอกสารไปไว้ในเอกสารที่แยกทิ้ง = แถบหัวหายทั้งแถบ */
                if (newEl.parentNode && live.contains(newEl.parentNode)) {
                    newEl.parentNode.replaceChild(keptOld[i], newEl);
                }
            });

            if (!sidebarOpen) {
                live.classList.add('sidebar-collapsed');
            }

            /* เติมคลาสก่อนรันสคริปต์ของหน้าใหม่ :
               สคริปต์บางหน้า (Dashboard) เรนเดอร์ตารางทันทีและบังคับวัดเลย์เอาต์
               ถ้าปล่อยให้อนิเมชัน "เข้าหน้า" (fade-in / page-enter) เริ่มไปก่อน
               แล้วค่อยเติม is-nav เพื่อปิดทีหลัง จะเห็นเนื้อหากระพริบหนึ่งครั้ง */
            var root = document.documentElement;
            root.classList.remove('is-loading');
            root.classList.remove('is-loaded');
            root.classList.add('is-nav');
            root.classList.remove('is-leaving');

            /* ไม่ใส่ is-nav-in : หน้าใหม่ขึ้นที่ opacity เต็มทันที
               (เดิมเฟดเข้าจาก opacity 0 = เห็นพื้นหน้าว่างวาบก่อนเนื้อหามา) */

            /* อัปเดต URL ก่อนรันสคริปต์ของหน้าใหม่
               สคริปต์ที่อ่าน ?page= / ?scope= (PubHead ไฮไลต์เมนู, Dashboard กรอง "งานของฉัน")
               จะได้เห็นค่าใหม่ทันที — เดิม pushState เกิดหลังสคริปต์รัน
               ไฮไลต์/ตัวกรองจึงค้างเป็นของหน้าเดิม = เห็นเมนูกระพริบ
               (และงานของฉันอาจแสดงชุดข้อมูลผิดรอบ) */
            if (push) {
                try {
                    window.history.pushState({ dtam: 1 }, '', url.pathname + url.search + url.hash);
                } catch (e) { }
            }

            /* เขียน page + token ลง URL จริงของเว็บแอป (…/exec) ด้วย
               เพื่อให้กดรีเฟรชแล้วกลับมาหน้านี้พร้อม session เดิม
               ไม่ต้องล็อกอินใหม่ (ดู App.sync) */
            if (window.App && typeof window.App.sync === 'function') {
                window.App.sync((url.searchParams && url.searchParams.get('page')) || 'form', url.search);
            }

            runScripts(scripts);

            /* เฟดเข้าอ่อน ๆ (0.24 วิ) ให้รู้ว่าหน้าใหม่ขึ้นแล้ว
               เริ่มหลังสลับเสร็จ จึงไม่ทับช่วงรอข้อมูล */
            root.classList.add('is-nav-in');

            if (nav.timer) {
                window.clearTimeout(nav.timer);
            }

            nav.timer = window.setTimeout(function () {
                nav.timer = 0;
                root.classList.remove('is-nav-in');
            }, 300);

            /* ไฮไลต์เมนูของหน้าเป้าหมาย : ใส่ "หลัง" สคริปต์ของหน้าใหม่รันจบ
               - สคริปต์ของหน้า (PubHead / AppJS) คิดไฮไลต์เองจาก URL ตอนที่รัน
                 ถ้าเราใส่ก่อน มันจะทับค่าของเรา — หรือถ้าปล่อยให้มันใส่เอง
                 ก็มีจังหวะที่ยังไม่ใส่ = เห็นเมนูกระพริบ
               - ทั้งหมดนี้อยู่ในงานเดียวกับ swap เบราว์เซอร์จึงวาดครั้งเดียว
                 = ไม่มีเฟรมที่ไฮไลต์หาย */
            var wantPage = '';

            if (url && url.searchParams) {
                wantPage = url.searchParams.get('page') || 'form';

                if (wantPage === 'dashboard' && url.searchParams.get('scope') === 'mine') {
                    wantPage = 'mywork';
                }
            }

            if (wantPage) {
                Array.prototype.forEach.call(document.querySelectorAll('.nav-link[data-page], .site-nav a[data-page]'), function (link) {
                    var on = link.getAttribute('data-page') === wantPage;

                    if (link.closest('.site-nav')) {
                        link.classList.toggle('is-active', on);
                    } else {
                        link.classList.toggle('active', on);
                    }

                    /* หน้านีี้กดซ้ำไม่ได้ : บอกโปรแกรมอ่านจอด้วย */
                    if (on) {
                        link.setAttribute('aria-current', 'page');
                    } else {
                        link.removeAttribute('aria-current');
                    }
                });
            }

            window.scrollTo(0, 0);
        }

        /* แสดงหน้าใหม่ : สลับเนื้อหาให้จบในเฟรมเดียว
           ------------------------------------------------------------
           เดิมมีจังหวะ "เฟดออก 200ms → สลับ → เฟดเข้า" วัดแล้วพบว่าเนื้อหาถูกซ่อน
           จน opacity = 0 ภายในเฟรมเดียว แล้วพื้นหน้าว่างค้างอยู่ ~215ms ก่อนหน้าใหม่
           จะค่อย ๆ ขึ้น = เห็นเป็นจอกระพริบทุกครั้งที่กดเมนู
           ตอนนี้สลับทันที (ยังดึง HTML ให้เสร็จก่อน เนื้อหาเดิมจึงไม่หายระหว่างรอเน็ต)
           แล้วขึ้นหน้าใหม่ที่ opacity เต็มในเฟรมถัดไป — ไม่มีเฟรมว่างเลย */
        function show(html, url, push) {
            /* รอบนี้ได้คำตอบแล้ว — ยกเลิกตัวจับเวลากันค้าง */
            clearNavTimeout();

            /* จำหน้านี้ไว้ในหน่วยความจำเลย ไม่พึ่ง URL อย่างเดียว
               (pushState ด้านล่างอาจถูกบล็อกจน URL ค้างหน้าเก่า) */
            try {
                nav.current = navKey(url);
            } catch (e) { }

            var root = document.documentElement;

            root.classList.add('is-nav');
            root.classList.remove('is-loading');
            root.classList.remove('is-loaded');

            /* เคลียร์คลาส/ตัวจับเวลาที่ค้างจากรอบก่อน ไม่ให้ทับสถานะรอบนี้ */
            if (nav.timer) {
                window.clearTimeout(nav.timer);
                nav.timer = 0;
            }

            root.classList.remove('is-nav-in');
            root.classList.remove('is-leaving');
            endWait();

            /* จำตำแหน่งเมนูของหน้าเดิมไว้ — หน้า login ใช้ทำ FLIP
               ให้เมนูไหลเข้าไปแทนปุ่มที่หายไป แทนการกระโดดไปตำแหน่งใหม่ทันที */
            try {
                var navEl = document.getElementById('siteNav');

                if (navEl) {
                    window.sessionStorage.setItem('dtam:nav-left',
                        String(Math.round(navEl.getBoundingClientRect().left)));
                }
            } catch (e) { }

            /* ให้สคริปต์ของหน้าเดิมเคลียร์ timer ของตัวเองก่อน (นาฬิกาใน AppJS) */
            try {
                window.dispatchEvent(new CustomEvent('dtam:before-navigate'));
            } catch (e) { }

            var hold = endWait();
            var token = nav.token;

            nav.busy = false;

            /* กดเมนูอื่นค้างไว้ระหว่างดึงข้อมูล : ข้ามหน้านี้ไปหน้าล่าสุดเลย
               (สลับหน้านี้ก่อนแล้วค่อยสลับอีกที = เห็นเนื้อหากระพริบสองรอบ) */
            if (nav.pending) {
                var next = nav.pending;
                nav.pending = '';
                go(next, true);
                return;
            }

            if (hold > 0) {
                /* ถ้าสปินเนอร์ขึ้นไปแล้ว ให้ค้างไว้ให้เห็นก่อนค่อยสลับหน้า */
                window.setTimeout(function () {
                    if (token !== nav.token) {
                        return;
                    }

                    swap(html, url, push);
                }, hold);
                return;
            }

            swap(html, url, push);
        }

        /* ดึง HTML ของหน้าเป้าหมาย
           - อยู่ใน iframe ของ Apps Script : เรียกผ่าน google.script.run (getPageHtml)
             เพราะ fetch หน้าเดียวกันจากใน iframe บางเครื่องถูกบล็อก/ได้หน้า wrapper
             → สลับหน้าไม่ได้ แล้วต้องโหลดใหม่ทั้งหน้า = กระพริบ
           - อยู่นอก Apps Script (เช่น preview/ไฟล์บนเว็บ) : ใช้ fetch เหมือนเดิม */
        function loadHtml(url, done, fail) {
            var page = url.searchParams.get('page') || 'form';
            var runner = window.google && window.google.script && window.google.script.run;
            var finished = false;

            /* คืน true = ได้หน้าที่ใช้ได้แล้ว (สลับหน้าให้เลย) */
            function deliver(html) {
                if (finished) {
                    return true;
                }

                if (!html || html.indexOf('<body') === -1) {
                    /* หน้าเปล่า/หน้า wrapper ของ Google — เอามาสลับไม่ได้ */
                    return false;
                }

                finished = true;
                done(html);
                return true;
            }

            function viaScriptRun(ok, no) {
                if (!runner) {
                    no();
                    return;
                }

                try {
                    runner
                        .withSuccessHandler(function (html) {
                            if (!deliver(html)) {
                                ok();
                            }
                        })
                        .withFailureHandler(no)
                        .getPageHtml(page, (window.App && window.App.auth) ? window.App.auth.token() : '');
                } catch (e) {
                    no();
                }
            }

            function viaFetch(ok, no) {
                fetch(url.href, { credentials: 'same-origin' })
                    .then(function (res) {
                        if (!res.ok) {
                            throw new Error('HTTP ' + res.status);
                        }

                        return res.text();
                    })
                    .then(function (html) {
                        if (!deliver(html)) {
                            ok();
                        }
                    })
                    .catch(no);
            }

            /* ลองช่องทางหลักก่อน ถ้าล้มค่อยลองอีกช่องทาง
               (โหลดใหม่ทั้งหน้าคือสิ่งที่เห็นเป็น "กระพริบ" จึงขอลองให้ครบก่อน) */
            var order = (inIframe() && runner) ? [viaScriptRun, viaFetch] : [viaFetch, viaScriptRun];
            var i = 0;

            (function next() {
                if (finished) {
                    return;
                }

                while (i < order.length) {
                    try {
                        order[i++](next, next);
                        return;
                    } catch (e) { }
                }

                fail();
            })();
        }

        /* ไปหน้าในแอป : ดึงเนื้อหาให้เสร็จก่อน แล้วค่อยสลับทันที (ไม่เฟดจาง)
           ระหว่างรอ เนื้อหาเดิมยังอยู่ครบ — ไม่มีช่วงจอว่างให้เห็นเป็นกระพริบ */
        function go(href, push) {
            var url = appUrl(href);

            if (!url) {
                return;
            }

            /* กดเมนูของหน้าที่เปิดอยู่ : ไม่ต้องสลับ/โหลดใหม่
               แต่ขยับขึ้นบนสุดนิดหนึ่งให้รู้ว่ากดติด (ไม่งั้นดูเหมือนปุ่มเสีย
               โดยเฉพาะกดเมนูแจ้งปัญหาตอนอยู่หน้าฟอร์มอยู่แล้ว) */
            if (isSamePage(url)) {
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (e) {
                    try {
                        window.scrollTo(0, 0);
                    } catch (e2) { }
                }
                return;
            }

            /* ระหว่างกำลังดึง/สลับหน้า : จำเมนูล่าสุดไว้ ไปต่อเมื่อรอบนี้จบ
               (เดิมคลิกหลุดเงียบ ๆ เหมือนเว็บค้าง) */
            if (nav.busy) {
                nav.pending = url.href;
                return;
            }

            /* เปิดไฟล์ตรง ๆ (file://) สลับหน้าในที่เดียวไม่ได้เด็ดขาด
               เพราะเบราว์เซอร์บล็อก fetch ข้ามเอกสารบน file:// (origin = null)
               และไม่มี google.script.run — ไม่ต้องเสียเวลาลอง
               การโหลดใหม่ทั้งหน้าเป็นเรื่องปกติของโหมดนี้ */
            if (window.location.protocol === 'file:') {
                window.location.href = url.href;
                return;
            }

            nav.busy = true;
            nav.token = (nav.token || 0) + 1;

            /* แสดงสถานะกำลังโหลดระหว่างรอหน้าใหม่ : แถบวิ่งบาง ๆ + ตัวหมุน
               (เนื้อหาเดิมยังอยู่ครบ ไม่ถูกซ่อน = ไม่มีจอว่าง) */
            beginWait();

            var token = nav.token;

            clearNavTimeout();
            nav.timeout = window.setTimeout(function () {
                if (token !== nav.token) {
                    return;
                }
                nav.timeout = 0;
                /* เพิ่มรุ่นทิ้งผลที่อาจมาสายทีหลัง — หน้านี้กำลังจะโหลดใหม่แล้ว */
                nav.token = (nav.token || 0) + 1;
                document.documentElement.classList.remove('is-leaving');
                endWait();
                nav.busy = false;
                nav.pending = '';
                window.location.href = url.href;
            }, NAV_TIMEOUT_MS);

            loadHtml(url, function (html) {
                /* มีรอบใหม่แซงไปแล้ว (เช่น กดเมนูอื่นระหว่างรอ) — ทิ้งผลนี้ */
                if (token !== nav.token) {
                    return;
                }

                show(html, url, push);
            }, function () {
                /* มีรอบใหม่แซงไปแล้ว : อย่าไปแตะสถานะของรอบนั้น */
                if (token !== nav.token) {
                    return;
                }

                /* พลาดแล้ว : โหลดหน้าใหม่ตามปกติ จะได้ไม่ค้างอยู่หน้าเดิม
                   ไม่จำ "ใช้สลับหน้าไม่ได้" ไว้ใน session อีกแล้ว
                   (ของเดิมจำไว้ ทำให้คลิกถัด ๆ ไปเป็นการโหลดใหม่ทั้งหน้า
                    = กระพริบทุกครั้งตลอดทั้งเซสชัน) */
                document.documentElement.classList.remove('is-leaving');
                clearNavTimeout();
                endWait();
                nav.busy = false;
                window.location.href = url.href;
            });
        }

        document.addEventListener('click', function (event) {
            if (event.defaultPrevented || event.button !== 0 || event.metaKey ||
                event.ctrlKey || event.shiftKey || event.altKey) {
                return;
            }

            var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;

            if (!link || skip(link)) {
                return;
            }

            var url = appUrl(link.href);

            if (!url) {
                return;
            }

            event.preventDefault();
            go(url.href, true);
        }, true);

        /* ให้หน้าอื่นสั่งเปลี่ยนหน้าแบบสลับในที่เดียวได้ (เช่น ปุ่มเข้าสู่ระบบ)
           ต้องส่ง URL แบบ ?page=… ไม่ใช่ URL เต็ม : appUrl() จะเทียบกับโดเมน
           ของเอกสารปัจจุบัน (ใน Apps Script คือโดเมน sandbox) */
        nav.go = go;

        /* ปุ่มย้อนกลับ / ไปข้างหน้า ของเบราว์เซอร์ */
        window.addEventListener('popstate', function () {
            go(window.location.href, false);
        });
    })();
</script>
