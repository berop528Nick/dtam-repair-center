<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบแจ้งปัญหาคอมพิวเตอร์และอุปกรณ์</title>
    <meta name="description" content="ศูนย์การแพทย์แผนไทยและการแพทย์ทางเลือก — แจ้งปัญหา/ติดตามสถานะ/ระบบเจ้าหน้าที่">
    <meta name="theme-color" content="#1a7a44">
    <link rel="icon" href="data:,">

    <!-- ไฟล์นี้เป็น "หน้ากาก" ของเว็บแอป Google Apps Script
         ตัวแอปทำงานอยู่บน Google (…/exec) ทั้งหมด — บันทึกลงชีต/อัปโหลดรูปได้ครบ
         หน้านี้มีไว้ให้ได้ลิงก์ github.io ที่สั้นและส่งต่อง่ายเท่านั้น

         ถ้าดีพลอยใหม่แล้ว URL ของเว็บแอปเปลี่ยน ให้แก้ค่าที่ data-app-url ด้านล่างจุดเดียว -->
    <style>
        :root {
            --brand-green: #1a7a44;
            --page-bg: #f4f7f9;
            --text: #2c3b34;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
            font-family: "Kanit", "Sarabun", "Segoe UI", Tahoma, sans-serif;
        }

        /* ตัวแอปเอง (iframe) กินเต็มจอ — ไม่มีขอบ ไม่มี scrollbar ซ้อน */
        .app-frame {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: var(--page-bg);
        }

        /* ---------- หน้าโหลดระหว่างรอ Google ตอบ -- */
        .splash {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: var(--page-bg);
            transition: opacity 0.28s ease;
        }

        .splash.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash p {
            margin: 0;
            color: var(--brand-green);
            font-size: 0.875rem;
        }

        .ring {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(26, 122, 68, 0.16);
            border-top-color: var(--brand-green);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ring {
                animation: none;
            }
        }

        /* ---------- ทางออกเมื่อ Google ไม่ยอมให้ฝัง iframe ----------
           ซ่อนไว้เป็นค่าเริ่มต้น (ไม่ให้บังแอปตอนใช้งานปกติ)
           สคริปต์ด้านล่างจะเติมคลาส .is-shown เฉพาะเมื่อโหลดแอปไม่สำเร็จเท่านั้น */
        .open-app {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 3;
            padding: 9px 14px;
            border-radius: 999px;
            background: var(--brand-green);
            color: #fff;
            font-size: 0.8125rem;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(26, 122, 68, 0.28);
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition: opacity 0.24s ease, transform 0.24s ease, visibility 0s linear 0.24s;
        }

        .open-app.is-shown {
            opacity: 1;
            visibility: visible;
            transform: none;
            transition: opacity 0.24s ease, transform 0.24s ease, visibility 0s linear 0s;
        }

        .open-app:hover,
        .open-app:focus-visible {
            background: #155f34;
        }

        @media (prefers-reduced-motion: reduce) {
            .open-app {
                transition: none;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <iframe class="app-frame" id="app" title="ระบบแจ้งปัญหาคอมพิวเตอร์และอุปกรณ์"
        data-app-url="https://script.google.com/macros/s/AKfycbxti_Wc4yJepfYI5vPq5ZsO4a3XBeTj3I4Bupm_CbVwlF3FXoyrI8wGNKmclNMcysZLQw/exec"
        allow="clipboard-write"></iframe>

    <div class="splash" id="splash" role="status">
        <span class="ring" aria-hidden="true"></span>
        <p>กำลังเปิดระบบ…</p>
    </div>

    <a class="open-app" id="openApp"
        href="https://script.google.com/macros/s/AKfycbxti_Wc4yJepfYI5vPq5ZsO4a3XBeTj3I4Bupm_CbVwlF3FXoyrI8wGNKmclNMcysZLQw/exec"
        target="_blank" rel="noopener">เปิดในแท็บใหม่</a>

    <script>
        (function () {
            var frame = document.getElementById('app');
            var splash = document.getElementById('splash');
            var openApp = document.getElementById('openApp');
            var appUrl = frame.getAttribute('data-app-url');

            /* ---------- จำ session ของเจ้าหน้าที่ไว้ที่หน้านี้ ----------
               หน้าแอปทำงานใน iframe ของ Google ซึ่งรีเฟรชแล้ว token หาย
               (URL ที่เบราว์เซอร์เห็นคือ …/exec ไม่ใช่ URL ใน iframe)
               จึงเก็บ token ไว้ที่ origin ของหน้านี้ แล้วแนบ ?t=…&page=…
               กลับไปให้ iframe ทุกครั้งที่โหลด

               ผู้ใช้ทั่วไปที่ยังไม่ล็อกอิน = ไม่มี session → โหลดแอปตามปกติ
               (เห็นฟอร์มแจ้งซ่อม/ติดตามสถานะ ไม่ต้องล็อกอิน) */
            var STORE_KEY = 'dtam:session';

            function readSession() {
                try {
                    var data = JSON.parse(window.localStorage.getItem(STORE_KEY) || 'null');

                    if (!data || !data.token) {
                        return null;
                    }

                    if (data.exp && Number(data.exp) < Date.now()) {
                        window.localStorage.removeItem(STORE_KEY);
                        return null;
                    }

                    return data;
                } catch (e) {
                    return null;
                }
            }

            function writeSession(data) {
                try {
                    if (data && data.token) {
                        window.localStorage.setItem(STORE_KEY, JSON.stringify(data));
                    } else {
                        window.localStorage.removeItem(STORE_KEY);
                    }
                } catch (e) { }
            }

            function withSession(url) {
                var session = readSession();

                if (!session) {
                    return url;
                }

                var query = 't=' + encodeURIComponent(session.token) +
                    '&page=' + encodeURIComponent(session.page || 'dashboard');

                return url + (url.indexOf('?') >= 0 ? '&' : '?') + query;
            }

            function refreshLinks() {
                var url = withSession(appUrl);

                openApp.href = url;

                return url;
            }

            /* ตัวแอปส่ง session มาให้เมื่อล็อกอิน/เปลี่ยนหน้า/ออกจากระบบ */
            window.addEventListener('message', function (event) {
                var data = event.data;

                if (!data || data.dtam !== 'auth') {
                    return;
                }

                if (data.token) {
                    writeSession({
                        token: String(data.token),
                        page: data.page || 'dashboard',
                        name: data.name || '',
                        exp: Number(data.exp || 0)
                    });
                } else {
                    writeSession(null);
                }

                /* อัปเดตเฉพาะปุ่มเปิดแท็บใหม่ — ไม่แตะ iframe
                   (โหลด iframe ใหม่ตอนนี้ = รีเฟรชแอปโดยไม่จำเป็น) */
                refreshLinks();
            });

            var loaded = false;

            /* ให้ iframe + ปุ่ม "เปิดในแท็บใหม่" ใช้ URL เดียวกันเสมอ
               (แก้ที่ data-app-url จุดเดียวพอ) */
            frame.src = refreshLinks();

            function hideSplash() {
                splash.classList.add('is-hidden');
            }

            /* โชว์ปุ่มทางออกเฉพาะตอนจำเป็น ไม่ให้ลอยบังแอปในกรณีปกติ */
            function showFallback() {
                openApp.classList.add('is-shown');
            }

            frame.addEventListener('load', function () {
                loaded = true;
                window.setTimeout(hideSplash, 150);

                /* ตัวเว็บแอปของ Apps Script จะสร้าง frame ย่อยของตัวเอง 1 ชั้น
                   ถ้าโหลดเสร็จแล้วยังไม่มี frame ย่อย = Google ไม่ยอมให้ฝัง/ได้หน้า error
                   จึงค่อยโชว์ปุ่ม (หน่วงนิดหนึ่งให้ wrapper สร้าง frame เสร็จก่อน) */
                window.setTimeout(function () {
                    var inner = 1;

                    try {
                        inner = frame.contentWindow.length;
                    } catch (e) {
                        inner = 0;
                    }

                    if (!inner) {
                        showFallback();
                    }
                }, 1200);
            });

            /* กันเหนียว: Google บล็อกการฝังหรือเน็ตช้า ก็ไม่ค้างอยู่ที่หน้าโหลด
               (ถ้าจอว่าง ผู้ใช้ยังกด "เปิดในแท็บใหม่" ได้) */
            window.setTimeout(function () {
                hideSplash();

                if (!loaded) {
                    showFallback();
                }
            }, 8000);
        })();
    </script>
</body>

</html>
