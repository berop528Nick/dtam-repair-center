<script>
    /* เติมคลาสที่ <html> ตั้งแต่เริ่ม parse เพื่อให้เห็นสถานะโหลดทันที
       (ไม่ต้องรอ AppJS ที่อยู่ท้ายหน้า)
       ระหว่าง is-loading เนื้อหาจะถูกซ่อนไว้ แล้วค่อย ๆ ขึ้นพร้อมกันตอนโหลดเสร็จ

       ยกเว้น "กดเมนูในแอป" : ลิงก์ ?page=... คือการโหลดหน้าใหม่ทั้งหน้า
       ถ้าโชว์สถานะโหลดซ้ำทุกครั้ง จอจะว่างแล้วค่อย ๆ ขึ้น = กระพริบทุกคลิก
       ตัวจำว่ามาจากเมนูใช้ query param (nav=1) ไม่ใช้ sessionStorage
       เพราะใน iframe ของ Apps Script บางเครื่อง sessionStorage ถูกบล็อก */
    (function () {
        var NAV_PARAM = 'nav';
        var MIN_MS = 430;
        var FADE_MS = 320;
        var root = document.documentElement;
        var fromNav = false;

        /* บอก CSS ว่าแถบหัวสูงเท่าไร : ฝ้าเบลอ/ตัวหมุนตอนโหลด
           จะได้เริ่มใต้แถบหัว ไม่ทับเมนูด้านบน (ดู --load-top ใน Styles) */
        function markHeaderHeight() {
            var header = document.querySelector('.app-header');

            if (header) {
                root.style.setProperty('--load-top', header.offsetHeight + 'px');
            }
        }

        markHeaderHeight();
        window.addEventListener('resize', markHeaderHeight);

        /* จอเล็ก : ซ่อนเมนูข้างตั้งแต่ก่อนเบราว์เซอร์วาดเฟรมแรก
           ถ้ารอให้สคริปต์ท้ายหน้าเป็นคนใส่คลาส จะเห็นเมนูโผล่แวบหนึ่งแล้วค่อยเลื่อนออก (กระพริบ) */
        try {
            if (window.matchMedia('(max-width: 900px)').matches) {
                document.body.classList.add('sidebar-collapsed');
            }
        } catch (e) { }

        try {
            var here = new URL(window.location.href);
            fromNav = here.searchParams.get(NAV_PARAM) === '1';

            if (fromNav) {
                /* เก็บ nav=1 ออกจาก URL ให้เรียบร้อยก่อนใช้งานต่อ */
                here.searchParams.delete(NAV_PARAM);
                window.history.replaceState(null, '', here.pathname + here.search + here.hash);
            }
        } catch (e) {
            fromNav = /[?&]nav=1(&|$)/.test(window.location.search);
        }

        /* ยกเลิกตัวเติม nav=1 : NavJS สลับหน้าในที่เดียวเองแล้ว (ดู NavJS.html)
           ถ้าปล่อยไว้ ทุกครั้งที่โหลดใหม่แบบเต็มหน้า (หรือเปิดลิงก์แท็บใหม่)
           จะทิ้ง ?nav=1 ค้างใน URL โดยไม่จำเป็น — ตัวอ่าน/เก็บกวาดค่ายังอยู่ด้านบน
           เอาไว้รองรับลิงก์เก่าที่มี nav=1 ติดมา */

        /* เฟดออกก่อนเปลี่ยนหน้าแบบโหลดใหม่ทั้งหน้า
           - ถ้าตัวอื่นจัดการคลิกไปแล้ว (NavJS / ปุ่มเจ้าหน้าที่เข้าระบบ) จะมี defaultPrevented
             = ข้ามไป เพราะตัวนั้นมีอนิเมชันปิดของตัวเอง
           - ลิงก์นอกเว็บ / แท็บใหม่ / ดาวน์โหลด ไม่ต้องเฟด (จะกลายเป็นค้างจาง) */
        var LEAVING_MS = 200;

        document.addEventListener('click', function (event) {
            if (event.defaultPrevented || event.button !== 0 || event.metaKey ||
                event.ctrlKey || event.shiftKey || event.altKey) {
                return;
            }

            var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;

            if (!link || link.target === '_blank' || link.hasAttribute('download')) {
                return;
            }

            var href = link.getAttribute('href') || '';

            if (href.charAt(0) === '#' || /^(mailto|tel|javascript):/i.test(href)) {
                return;
            }

            var next;

            try {
                next = new URL(link.href, window.location.href);
            } catch (e) {
                return;
            }

            if (next.origin !== window.location.origin) {
                return;
            }

            /* target=_top ใน iframe ของ Apps Script : ให้เบราว์เซอร์พาออกไปเอง */
            var inIframe = false;

            try {
                inIframe = window.top !== window.self;
            } catch (e) {
                inIframe = true;
            }

            if ((link.getAttribute('target') || '').toLowerCase() === '_top' && inIframe) {
                return;
            }

            event.preventDefault();

            /* ไม่เฟดจางทั้งหน้าก่อนโหลดหน้าใหม่ : การจางทำให้เนื้อหาว่างเปล่า ~200ms
               แล้วค่อยเจอหน้าจอโหลดใหม่ = เห็นเป็นกระพริบสองจังหวะติดกัน
               ปล่อยให้เบราว์เซอร์ค้างหน้าเดิมไว้จนหน้าใหม่พร้อมสลับเอง */
            window.location.href = link.href;
        });

        if (fromNav) {
            /* มาจากเมนู : เนื้อหาขึ้นทันที ไม่มีตัวหมุน แต่ยังเฟดเข้าอ่อน ๆ
               ให้ต่อเนื่องจากการเฟดออกของหน้าเดิม */
            root.classList.add('is-nav');
            root.classList.add('is-nav-in');

            window.setTimeout(function () {
                root.classList.remove('is-nav-in');
            }, 280);
            return;
        }

        root.classList.add('is-loading');

        function finish() {
            window.setTimeout(function () {
                root.classList.remove('is-loading');
                root.classList.add('is-loaded');
                window.setTimeout(function () {
                    root.classList.remove('is-loaded');
                }, FADE_MS);
            }, Math.max(0, MIN_MS - performance.now()));
        }

        if (document.readyState === 'complete') {
            finish();
        } else {
            window.addEventListener('load', finish);
        }

        /* กันเหนียว : ถ้าการโหลดค้างผิดปกติ ก็ยังโชว์เนื้อหาภายใน 4 วินาที */
        window.setTimeout(function () {
            root.classList.remove('is-loading');
            root.classList.remove('is-loaded');
        }, 4000);
    })();
</script>
