    <script>
        (function () {
            var form = document.querySelector('.frm-login');
            var submit = form ? form.querySelector('button[type="submit"]') : null;
            var busy = false;

            App.initShell(); // ผูกปุ่มปิดกล่องแจ้งเตือน (หน้านี้ไม่มีเมนูข้าง)

            /* ถ้ายังล็อกอินอยู่ (เช่น กด "แจ้งปัญหา" จากแดชบอร์ด แล้วกดปุ่ม
               "เจ้าหน้าที่เข้าสู่ระบบ" กลับมา) ไม่ต้องล็อกอินซ้ำ :
               ตรวจ token กับเซิร์ฟเวอร์แล้วพากลับแดชบอร์ดทันที
               (ถ้า token หมดอายุ/ถูกยกเลิก จะค้างอยู่หน้า login ตามปกติ) */
            if (App.auth.token()) {
                App.auth.verify(function (profile) {
                    if (profile) {
                        App.goTo('?page=dashboard');
                    }
                });
            }

            function setBusy(on) {
                busy = !!on;

                if (!submit) {
                    return;
                }

                submit.disabled = busy;
                submit.textContent = busy ? 'กำลังตรวจสอบ…' : 'เข้าสู่ระบบ';
            }

            function enter(data) {
                App.auth.set(data);
                setBusy(false);

                /* จำ session ลง URL จริงของเว็บแอป + บอกหน้ากากที่ฝัง iframe อยู่
                   ตั้งแต่ตอนนี้เลย เพื่อให้กดรีเฟรชทันทีหลังล็อกอินก็ไม่หลุด */
                App.sync('dashboard');

                /* ใช้ App.goTo ไม่ใช้ window.location.href : ใน iframe ของ Apps Script
                   สลับหน้าจะไม่เกิดการโหลดใหม่ = ไม่มีจังหวะจอขาว
                   แนบ token ไปกับ URL ด้วย (?t=…) เพราะ storage ใน iframe
                   ของ Apps Script มักถูกบล็อก/ล้างเมื่อรีเฟรช */
                App.goTo('?page=dashboard&t=' + encodeURIComponent(data.token || ''));
            }

            if (!form) {
                return;
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                if (busy) {
                    return;
                }

                var user = form.userId.value.trim();
                var pass = form.password.value;
                var run = window.google && window.google.script && window.google.script.run;

                if (!user || !pass) {
                    App.dialog('กรอกข้อมูลไม่ครบ', 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                    return;
                }

                /* โหมดตัวอย่าง (preview / เปิดไฟล์ตรง ๆ) : ไม่มีเซิร์ฟเวอร์ให้ตรวจสิทธิ์ */
                if (!run) {
                    enter({ token: 'preview', name: user, role: 'staff', exp: 0 });
                    return;
                }

                setBusy(true);

                try {
                    run.withSuccessHandler(function (res) {
                        if (!res || !res.ok) {
                            setBusy(false);
                            App.dialog('เข้าสู่ระบบไม่สำเร็จ', (res && res.message) || 'ลองใหม่อีกครั้ง');
                            return;
                        }

                        enter({ token: res.token, name: res.name, role: res.role, exp: res.exp });
                    }).withFailureHandler(function (err) {
                        setBusy(false);
                        App.dialog('เชื่อมต่อไม่สำเร็จ', String((err && err.message) || err || 'ลองใหม่อีกครั้ง'));
                    }).login(user, pass);
                } catch (e) {
                    setBusy(false);
                    App.dialog('เชื่อมต่อไม่สำเร็จ', String((e && e.message) || e));
                }
            });
        })();
    </script>
