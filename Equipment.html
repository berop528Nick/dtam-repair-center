<script>
    (function () {
        'use strict';

        /* ต้องล็อกอินก่อน : ไม่มี token หรือหมดอายุ = กลับไปหน้า login */

            return;
        }

        /* ---------- ข้อมูลสำรองสำหรับโหมดตัวอย่าง (ไม่มี Apps Script) ---------- */
        var DEMO_ROWS = [
            {

            },
            {

                owner: 'ปวีณา สุขศรี', acquiredAt: '2022-11-08', status: 'ส่งซ่อม'
            },
            {
                equipCode: '7440-003-0007', name: 'โปรเจกเตอร์ Epson EB-X06',
                category: 'โปรเจกเตอร์/ทีวี', department: 'ศพท.เขตสุขภาพที่ 7 จ.ขอนแก่น',
                owner: 'อรุณี พรหมมา', acquiredAt: '2024-01-25', status: 'ใช้งาน'
            },
            {
                equipCode: '7440-004-0021', name: 'เครื่องปรับอากาศ Carrier 18,000 BTU',
                category: 'ครุภัณฑ์สำนักงาน', department: 'ศพท.เขตสุขภาพที่ 4 จ.นนทบุรี สาขาตักศิลา',
                owner: 'ช่างประจำอาคาร', acquiredAt: '2021-06-30', status: 'ชำรุด'
            },
            {
                equipCode: '7440-005-0003', name: 'โน้ตบุ๊ก ASUS VivoBook',
                category: 'คอมพิวเตอร์/โน้ตบุ๊ก', department: 'ศูนย์การแพทย์แผนไทยและการแพทย์ทางเลือก',
                owner: 'ผู้อำนวยการ', acquiredAt: '2024-08-19', status: 'ใช้งาน'
            },
            {
                equipCode: '7440-006-0011', name: 'เครื่องเสียงห้องประชุม',
                category: 'เครื่องเสียง', department: 'ศพท.เขตสุขภาพที่ 2 จ.สุโขทัย',
                owner: 'ธุรการกลาง', acquiredAt: '2020-02-14', status: 'จำหน่าย'
            },
            {
                equipCode: '7440-007-0002', name: 'จอภาพ LED 24 นิ้ว',
                category: 'จอภาพ/มอนิเตอร์', department: 'ศพท.เขตสุขภาพที่ 1 จ.ลำปาง',
                owner: 'พีรวิชญ์ นวลทอง', acquiredAt: '2025-03-03', status: 'ใช้งาน'
            },
            {
                equipCode: '7440-008-0009', name: 'สแกนเนอร์ Fujitsu fi-7160',
                category: 'เครื่องพิมพ์/สแกนเนอร์', department: 'ศพท.เขตสุขภาพที่ 9 จ.สุรินทร์',
                owner: 'ปวีณา สุขศรี', acquiredAt: '2022-07-11', status: 'ใช้งาน'
            }
        ];

        /* ---------- โหลดข้อมูลจริงจากชีต ---------- */
        function loadRows(done) {
            var run = (window.google && window.google.script && window.google.script.run) || null;
            var token = App.auth.token();

            /* ไม่มีเซิร์ฟเวอร์ (preview / GitHub Pages) = โหมดตัวอย่าง */
            if (!run) {
                done(DEMO_ROWS);
                return;
            }

            if (!token) {
                App.auth.signOut();
                return;
            }

            document.body.classList.add('is-loading');

            /* ในโหมดเชื่อมต่อชีต : แสดงตามข้อมูลจริงเท่านั้น (ชีตว่าง = ตารางว่าง) */
            try {
                run.withSuccessHandler(function (res) {
                    document.body.classList.remove('is-loading');

                    if (!res || !res.ok) {
                        App.dialog('เซสชันหมดอายุ', (res && res.message) || 'กรุณาเข้าสู่ระบบใหม่');
                        App.auth.signOut();
                        return;
                    }

                    done(res.rows || []);
                }).withFailureHandler(function (err) {
                    document.body.classList.remove('is-loading');
                    App.dialog('ดึงข้อมูลครุภัณฑ์จากชีตไม่สำเร็จ', String((err && err.message) || err));
                    done([]);
                }).getEquipmentItems(token);
            } catch (e) {
                document.body.classList.remove('is-loading');
                App.dialog('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ', String((e && e.message) || e));
                done([]);
            }
        }

        /* ---------- ส่วนแสดงผล : เริ่มเมื่อได้ข้อมูลแล้ว ---------- */
        function startWithRows(ROWS) {

        var columns = [
            { key: 'equipCode', label: 'เลขครุภัณฑ์' },
            { key: 'name', label: 'ชื่อครุภัณฑ์' },
            { key: 'category', label: 'หมวดหมู่' },
            { key: 'department', label: 'หน่วยงาน' },
            { key: 'owner', label: 'ผู้ครอบครอง' },
            {
                key: 'acquiredAt',
                label: 'วันที่ขึ้นทะเบียน',
                render: function (row) { return App.thaiDate(row.acquiredAt); },
                text: function (row) { return App.thaiDate(row.acquiredAt); }
            },
            {
                key: 'status',
                label: 'สถานะ',
                render: function (row) { return App.statusBadge(row.status); }
            }
        ];

        document.querySelectorAll('[data-user-name]').forEach(function (el) {
            el.textContent = window.CURRENT_USER || 'ผู้ใช้งาน';
        });

        App.initShell();

        App.table({
            theadId: 'tableHead',
            tbodyId: 'tableBody',
            infoId: 'tableInfo',
            pagerId: 'pager',
            searchId: 'searchInput',
            pageSizeId: 'pageSize',
            keyField: 'equipCode',
            columns: columns,
            rows: ROWS,
            defaultSort: 'equipCode',
            exportName: 'equipment-list.csv',
            actionTitle: 'ดูรายละเอียดครุภัณฑ์',
            onAction: function (code) {
                var item = null;
                ROWS.forEach(function (row) {
                    if (String(row.equipCode) === String(code)) {
                        item = row;
                    }
                });
                if (!item) {
                    App.dialog('ไม่พบข้อมูล', 'ไม่พบครุภัณฑ์เลขที่ ' + code);
                    return;
                }
                App.dialog(item.equipCode + ' · ' + item.name,
                    'หมวดหมู่: ' + (item.category || '—') +
                    '\nหน่วยงาน: ' + (item.department || '—') +
                    '\nผู้ครอบครอง: ' + (item.owner || '—') +
                    '\nวันที่ขึ้นทะเบียน: ' + App.thaiDate(item.acquiredAt) +
                    '\nสถานะ: ' + (item.status || '—'));
            }
        });
        }

        loadRows(startWithRows);
    })();
</script>
