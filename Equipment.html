        /* ---------- โหลดข้อมูลจริงจากชีต ---------- */
        function loadRows(done) {
            var run = (window.google && window.google.script && window.google.script.run) || null;
            var token = App.auth.token();

            /* ไม่มีเซิร์ฟเวอร์ (preview / GitHub Pages) = โหมดตัวอย่าง */
            if (!run) {
                done(DEMO_ROWS);
                return;
            }

            if (!token) {
                App.auth.signOut();
                return;
            }

            document.body.classList.add('is-loading');

            /* ในโหมดเชื่อมต่อชีต : แสดงตามข้อมูลจริงเท่านั้น (ชีตว่าง = ตารางว่าง) */
            try {
                run.withSuccessHandler(function (res) {
                    document.body.classList.remove('is-loading');

                    if (!res || !res.ok) {
                        App.dialog('เซสชันหมดอายุ', (res && res.message) || 'กรุณาเข้าสู่ระบบใหม่');
                        App.auth.signOut();
                        return;
                    }

                    done(res.rows || []);
                }).withFailureHandler(function (err) {
                    document.body.classList.remove('is-loading');
                    App.dialog('ดึงข้อมูลครุภัณฑ์จากชีตไม่สำเร็จ', String((err && err.message) || err));
                    done([]);
                }).getEquipmentItems(token);
            } catch (e) {
                document.body.classList.remove('is-loading');
                App.dialog('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ', String((e && e.message) || e));
                done([]);
            }
        }

        /* ---------- ส่วนแสดงผล : เริ่มเมื่อได้ข้อมูลแล้ว ---------- */
        function startWithRows(ROWS) {

        var columns = [
            { key: 'equipCode', label: 'เลขครุภัณฑ์' },
            { key: 'name', label: 'ชื่อครุภัณฑ์' },
            { key: 'category', label: 'หมวดหมู่' },
            { key: 'department', label: 'หน่วยงาน' },
            { key: 'owner', label: 'ผู้ครอบครอง' },
            {
                key: 'acquiredAt',
                label: 'วันที่ขึ้นทะเบียน',
                render: function (row) { return App.thaiDate(row.acquiredAt); },
                text: function (row) { return App.thaiDate(row.acquiredAt); }
            },
            {
                key: 'status',
                label: 'สถานะ',
                render: function (row) { return App.statusBadge(row.status); }
            }
        ];

        document.querySelectorAll('[data-user-name]').forEach(function (el) {
            el.textContent = window.CURRENT_USER || 'ผู้ใช้งาน';
        });

        App.initShell();

        App.table({
            theadId: 'tableHead',
            tbodyId: 'tableBody',
            infoId: 'tableInfo',
            pagerId: 'pager',
            searchId: 'searchInput',
            pageSizeId: 'pageSize',
            keyField: 'equipCode',
            columns: columns,
            rows: ROWS,
            defaultSort: 'equipCode',
            exportName: 'equipment-list.csv',
            actionTitle: 'ดูรายละเอียดครุภัณฑ์',
            onAction: function (code) {
                var item = null;
                ROWS.forEach(function (row) {
                    if (String(row.equipCode) === String(code)) {
                        item = row;
                    }
                });
                if (!item) {
                    App.dialog('ไม่พบข้อมูล', 'ไม่พบครุภัณฑ์เลขที่ ' + code);
                    return;
                }
                App.dialog(item.equipCode + ' · ' + item.name,
                    'หมวดหมู่: ' + (item.category || '—') +
                    '\nหน่วยงาน: ' + (item.department || '—') +
                    '\nผู้ครอบครอง: ' + (item.owner || '—') +
                    '\nวันที่ขึ้นทะเบียน: ' + App.thaiDate(item.acquiredAt) +
                    '\nสถานะ: ' + (item.status || '—'));
            }
        });
